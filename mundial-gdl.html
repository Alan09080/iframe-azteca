    .leaflet-popup-content-wrapper {

    function buildPopupContent(titulo = null, texto = null, url = null, direccion= null) {
      var html = `<div class="popup-title">${titulo}</div>`;
      var descripcion = texto;

      if (descripcion) html += `<div class="popup-description">${descripcion}</div>`;

      if (direccion) {
        html += `<hr style="border:none;border-top:1px solid #cacaca; margin: 10px 0;">`;
        html += `<div class="popup-address">📍 ${direccion}</div>`;
      }

      if (url) {
        html += `<a class="popup-maps-link" href="${url}" target="_blank" rel="noopener noreferrer">📌 Abrir en Google Maps</a>`;
      }
      return html;
    }

      var texto = infoLugar ? infoLugar.texto : 'Sin descripción.';

    function resetCircleStyles() {
      allCircles.forEach(function (item) {
        var color = typeColors[item.type] || typeColors['otro'];
        item.circle.setStyle({
          fillColor: 'transparent',color: 'transparent',weight: 1,radius: 12,fillOpacity: 0.8
        });
        if (!map.hasLayer(item.circle)) {
          item.circle.addTo(map);
        }
      });
      map.fitBounds(bounds);
    }

    function highlightFiltered(filterType) {
      var matchingCoords = [];
      var cColor = typeColors[filterType] || '#f5a623';

      allCircles.forEach(function (item) {
        if (item.type === filterType) {

          item.circle.setStyle({
            fillColor: cColor,  color: cColor,  weight: 2,  radius: 16,  fillOpacity: 0.9
          });
          if (!map.hasLayer(item.circle)) {
            item.circle.addTo(map);
          }
          matchingCoords.push(item.coord);
        } else {

          if (map.hasLayer(item.circle)) {
            map.removeLayer(item.circle);
          }
        }
      });

      if (matchingCoords.length > 0) {
        var filterBounds = L.latLngBounds(matchingCoords);
        map.fitBounds(filterBounds, { padding: [60, 60], maxZoom: 1 });
      }
    }

    resetCircleStyles();

    filterButtons.forEach(function (btn) {
      btn.addEventListener('click', function () {

        filterButtons.forEach(function (b) { b.classList.remove('active'); });
        btn.classList.add('active');

        var activeFilter = btn.getAttribute('data-type');

        if (activeFilter === 'all') {
          resetCircleStyles();
        } else {
          highlightFiltered(activeFilter);
        }
      });
