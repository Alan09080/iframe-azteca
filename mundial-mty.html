    /* --- ESTILOS DEL BANNER DE FILTROS --- */
    #filter-banner {

      padding: 0 16px;
      position: fixed;
      right: 0;
      top: 0;
      z-index: 1000;
    }

      height: 4px;
    }

      border-radius: 2px;
    }
    .filter-btn {

        border: 1px solid #444;
        color: #ccc;
        cursor: pointer;
        flex-shrink: 0;
        font-family: 'Manrope', sans-serif;
        font-size: 13px;
        font-weight: 600;
        padding: 8px 14px;
        transition: all 0.2s ease;
        white-space: nowrap;
    }
    .filter-btn:hover {
      background: #333;
      border-color: #666;
      color: #fff;
    }
    .filter-btn.active {
      background: #f5a623;
      border-color: #f5a623;
      color: #1a1a1a;
    }
    /* --- ESTILOS DEL POPUP PERSONALIZADO --- */
    .leaflet-popup-content-wrapper {
      background: #ffffff;
      border-radius: 12px;
      box-shadow: 0 8px 24px rgba(0, 0, 0, 0.3);
      color: #000000;
      overflow: hidden;
      padding: 0;
    }
    .leaflet-popup-content {
      font-family: 'Manrope', sans-serif;
      font-size: 13px;
      line-height: 1.6;
      margin: 0;
      padding: 20px 18px;

    .leaflet-popup-tip {
      background: #ffffff;
    }
    .leaflet-popup-close-button {

      font-size: 18px !important;
      right: 10px !important;
      top: 8px !important;
    }
    .popup-title {
      color: #75001d;
      font-size: 15px;
      font-weight: 700;
      margin-bottom: 8px;

      {
        "id": 105,
        "coord": [215, 1120]
      },
      {
        "id": 94,
        "coord": [220, 1196]
      },
      {
        "id": 62,
        "coord": [249, 1190]
      },
      {
        "id": 36,
        "coord": [225, 1180]
      },
      {
        "id": 69,
        "coord": [235, 1189]
      }
    ]

    var puntoBanco = [
      [1090, 511],
      [983, 528]
    ]

    var puntoWifi = [
      [1046, 1165],
      [843, 589],
      [934, 553],
      [1136, 340],
      [337, 983],
      [531, 200]
    ]

    var typeColors = {
      comida: '#ff6b6b',
      cultura: '#3b82f6',
      compras: '#10b981',
      entretenimiento: '#a855f7',
      bancos: '#138D75',
      wifi: '#E74C3C',
      otro: '#888888'
    }

    function buildPopupContent(titulo = null, texto = null, url = null, direccion= null) {
      var html = `<div class="popup-title">${titulo}</div>`;
      var descripcion = texto;

      if (descripcion) html += `<div class="popup-description">${descripcion}</div>`;

      if (direccion) {
        html += `<hr style="border:none;border-top:1px solid #cacaca; margin: 10px 0;">`;
        html += `<div class="popup-address">📍 ${direccion}</div>`;
      }

      if (url) {
        html += `<a class="popup-maps-link" href="${url}" target="_blank" rel="noopener noreferrer">📌 Abrir en Google Maps</a>`;
      }
      return html;
    }

    var allCircles = [];

    puntos.forEach(function (punto) {
      var infoLugar = datosLugares.find(function (lugar) {
        return lugar.id === punto.id;
      });

      var titulo = infoLugar ? infoLugar.titulo : `Punto ${punto.id}`;
      var texto = infoLugar ? infoLugar.texto : 'Sin descripción.';
      var url = infoLugar ? infoLugar.url : null;
      var tipoEtiqueta = infoLugar ? infoLugar.etiqueta : 'otro';
      var direccion = infoLugar ? infoLugar.direccion : null;
      var textoPopup = buildPopupContent(titulo, texto, url, direccion);
      var circle = L.circle(punto.coord, { weight: 1 }).bindPopup(textoPopup, { maxWidth: 300, minWidth: 220 });

      allCircles.push({
        circle: circle,
        type: tipoEtiqueta,
        coord: punto.coord
      });
    });

    puntoBanco.forEach(function (coord, index) {
      var textoPopup = buildPopupContent('Banco Azteca');
      var circle = L.circle(coord, { weight: 1 })
        .bindPopup(textoPopup, { maxWidth: 300, minWidth: 220 });

      allCircles.push({
        circle: circle,
        type: 'bancos',
        coord: coord
      });
    });

    puntoWifi.forEach(function (coord, index) {
      var textoPopup = buildPopupContent('Wifi TotalPlay');
      var circle = L.circle(coord, { weight: 1 }).bindPopup(textoPopup, { maxWidth: 300, minWidth: 220 });

      allCircles.push({
        circle: circle,
        type: 'wifi',
        coord: coord
      });
    });

    var filterButtons = document.querySelectorAll('.filter-btn');

    function resetCircleStyles() {
      allCircles.forEach(function (item) {
        var color = typeColors[item.type] || typeColors['otro'];
        item.circle.setStyle({
          fillColor: 'transparent',color: 'transparent',weight: 1,radius: 12,fillOpacity: 0.8
        });
        if (!map.hasLayer(item.circle)) {
          item.circle.addTo(map);
        }
      });
      map.fitBounds(bounds);
    }

    function highlightFiltered(filterType) {
      var matchingCoords = [];
      var cColor = typeColors[filterType] || '#f5a623';

      allCircles.forEach(function (item) {
        if (item.type === filterType) {

          item.circle.setStyle({
            fillColor: cColor,  color: cColor,  weight: 2,  radius: 16,  fillOpacity: 0.9
          });
          if (!map.hasLayer(item.circle)) {
            item.circle.addTo(map);
          }
          matchingCoords.push(item.coord);
        } else {

          if (map.hasLayer(item.circle)) {
            map.removeLayer(item.circle);
          }
        }
      });

      if (matchingCoords.length > 0) {
        var filterBounds = L.latLngBounds(matchingCoords);
        map.fitBounds(filterBounds, { padding: [60, 60], maxZoom: 1 });
      }
    }

    resetCircleStyles();

    filterButtons.forEach(function (btn) {
      btn.addEventListener('click', function () {

        filterButtons.forEach(function (b) { b.classList.remove('active'); });
        btn.classList.add('active');

        var activeFilter = btn.getAttribute('data-type');

        if (activeFilter === 'all') {
          resetCircleStyles();
        } else {
          highlightFiltered(activeFilter);
        }
      });
    });
  </script>
</body>
</html>
